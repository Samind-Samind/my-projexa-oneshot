<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สมัครสมาชิก — Projexa</title>
<link rel="icon" href="assets/logo-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
<main class="auth-card">
  <img class="auth-logo" src="assets/logo-full.png" alt="Projexa">
  <h1 class="auth-title">สมัครสมาชิก</h1>
  <p class="auth-sub">สร้างบัญชีและเลือกบทบาทของคุณในโครงการ</p>
  <form id="signup-form" novalidate>
    <div class="field">
      <label for="name">ชื่อ-นามสกุล <span class="required">*</span></label>
      <input id="name" name="name" type="text" autocomplete="name">
    </div>
    <div class="field">
      <label for="email">อีเมล <span class="required">*</span></label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="password">รหัสผ่าน <span class="required">*</span></label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="6">
      <div class="field-hint">อย่างน้อย 6 ตัวอักษร</div>
    </div>
    <div class="field">
      <label for="role">บทบาท <span class="required">*</span></label>
      <select id="role" name="role"></select>
      <div class="field-hint" id="role-desc"></div>
    </div>
    <div id="form-error" class="field-error form-error" role="alert" hidden></div>
    <button type="submit" id="btn-signup" class="btn btn-primary btn-block">สมัครสมาชิก</button>
  </form>
  <p class="auth-foot">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
</main>
<div id="toast-root"></div>
<script type="module" src="js/signup.js"></script>
</body>
</html>
