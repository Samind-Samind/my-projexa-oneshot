<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCR-010 รายละเอียดหน้าจอ — Projexa</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="layout">
  <aside id="sidebar"></aside>
  <main class="main">
    <div class="breadcrumb"><a href="scr-009.html">ทะเบียนหน้าจอ</a> / <span id="crumb">รายละเอียดหน้าจอ</span></div>
    <div class="page-header">
      <div>
        <h1 class="page-title" id="page-title">รายละเอียดหน้าจอ</h1>
        <div class="page-sub" id="page-sub">SCR-010</div>
      </div>
      <div class="page-actions" id="header-actions"></div>
    </div>

    <div id="loading" class="loading-box"><span class="spinner spinner-lg"></span></div>

    <form id="screen-form" class="card stack hidden" novalidate>
      <div class="grid-2">
        <div class="field" id="f-code">
          <label for="code">รหัสหน้าจอ <span class="required">*</span></label>
          <input id="code" type="text" placeholder="เช่น SCR-101" autocomplete="off">
          <div class="field-error"></div>
        </div>
        <div class="field" id="f-name">
          <label for="name">ชื่อหน้าจอ <span class="required">*</span></label>
          <input id="name" type="text" autocomplete="off">
          <div class="field-error"></div>
        </div>
      </div>
      <div class="field">
        <label for="description">คำอธิบาย</label>
        <textarea id="description" rows="4" placeholder="อธิบายหน้าที่ของหน้าจอ (ใช้เป็นข้อมูลให้ AI แนะนำประเภท)"></textarea>
      </div>
      <div class="field" id="f-type">
        <label for="type">ประเภทหน้าจอ <span class="required">*</span></label>
        <div class="row">
          <select id="type"><option value="">— เลือกประเภท —</option></select>
          <button type="button" class="btn btn-secondary" id="btn-ai">ให้ AI ช่วยแนะนำประเภท</button>
          <span class="spinner hidden" id="ai-spinner"></span>
        </div>
        <div class="field-hint" id="type-hint"></div>
        <div class="field-error"></div>
      </div>
      <div id="ai-area"></div>
      <div id="meta-area" class="kv-list"></div>
      <div class="form-error hidden" id="form-error"></div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="btn-save">บันทึก</button>
        <a class="btn btn-secondary" href="scr-009.html">ยกเลิก</a>
      </div>
    </form>
  </main>
</div>
<div id="toast-root"></div>
<script type="module" src="js/screen-detail.js"></script>
</body></html>
