<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ระบบ — Projexa</title>
<link rel="icon" href="assets/logo-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
<main class="auth-card">
  <img class="auth-logo" src="assets/logo-full.png" alt="Projexa">
  <h1 class="auth-title">เข้าสู่ระบบ</h1>
  <p class="auth-sub">ระบบติดตามสถานะหน้าจอ (Screen Tracking)</p>
  <form id="login-form" novalidate>
    <div class="field">
      <label for="email">อีเมล <span class="required">*</span></label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="password">รหัสผ่าน <span class="required">*</span></label>
      <input id="password" name="password" type="password" autocomplete="current-password">
    </div>
    <div id="form-error" class="field-error form-error" role="alert" hidden></div>
    <button type="submit" id="btn-login" class="btn btn-primary btn-block">เข้าสู่ระบบ</button>
  </form>
  <p class="auth-foot">ยังไม่มีบัญชี? <a href="signup.html">สมัครสมาชิก</a></p>
</main>
<div id="toast-root"></div>
<script type="module" src="js/login.js"></script>
</body>
</html>
